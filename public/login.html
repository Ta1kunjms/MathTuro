<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Apply the saved font preference before first paint to avoid a flash
        // of the default font for returning users who enabled the dyslexia-
        // friendly toggle. Per-viewer UI preference only — localStorage, not
        // account data.
        (function () {
            try {
                if (localStorage.getItem('mathturo_font_pref') === 'dyslexic') {
                    document.documentElement.setAttribute('data-font', 'dyslexic');
                }
            } catch (e) { /* localStorage unavailable — fall back to default font */ }
        })();
    </script>
    <link rel="stylesheet" href="../dist/styles.css">
    <link rel="stylesheet" href="../shared/css/base.css">
    <script src="../shared/js/device.js"></script>
    <link rel="icon" type="image/png" href="../Logo/1.png">
    <title>Login - MathTuro LMS</title>
    <script src="shared/js/supabase-lib.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-family-base: 'Nunito', system-ui, sans-serif;
        }

        body {
            font-family: var(--font-family-base);
        }

        h1, h2, h3, h4, .font-display {
            font-family: 'Fredoka', system-ui, sans-serif;
        }

        .input-focus-effect:focus {
            box-shadow: 0 0 0 4px rgba(47, 119, 86, 0.2);
        }

        .role-tab {
            transition: background-color 0.2s ease, color 0.2s ease;
        }

        .role-tab.active {
            background: #2f7756; /* forest-600 */
            color: white;
        }

        .divider-line {
            background: #e4e1da; /* paper-200 */
        }

        /* Password toggle button */
        .password-toggle:hover {
            color: #2f7756;
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body class="bg-paper-50 min-h-screen flex items-center justify-center px-4 py-10">
    <!-- Skip Link for Accessibility -->
    <a href="#loginForm" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 bg-forest-800 text-white px-4 py-2 rounded-md z-50">
        Skip to login form
    </a>

    <div class="w-full max-w-md">
        <!-- Logo / wordmark -->
        <div class="flex justify-center mb-6">
            <a href="index.html" class="flex items-center gap-2">
                <div class="w-11 h-11 bg-white border-2 border-ink-900 rounded-xl flex items-center justify-center">
                    <img src="../Logo/1.png" alt="MathTuro" class="w-8 h-8 object-contain">
                </div>
                <span class="text-2xl font-bold text-ink-900" style="font-family: 'Lexend', system-ui, sans-serif;">MathTuro</span>
            </a>
        </div>

        <!-- Auth Card: single panel, no split -->
        <div class="bg-white border-2 border-ink-900 rounded-3xl p-6 sm:p-8">
            <!-- Welcome Text -->
            <div class="text-center mb-6">
                <div class="flex items-center justify-center gap-2 mb-1">
                    <img src="../Logo/2.png" alt="" aria-hidden="true" class="w-9 h-9">
                    <h1 class="text-2xl sm:text-3xl font-bold text-ink-900">
                        Welcome back
                    </h1>
                </div>
                <p class="text-ink-500 text-sm">
                    Sign in to continue your learning journey.
                </p>
            </div>

            <!-- Role Selection Tabs -->
            <div class="flex mb-6 bg-paper-100 border-2 border-ink-900 rounded-full p-1">
                <button type="button" id="studentTab"
                    class="role-tab flex-1 py-2.5 px-5 rounded-full text-sm font-semibold flex items-center justify-center space-x-2 active"
                    onclick="selectRole('student')">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                    <span>Student</span>
                </button>
                <button type="button" id="teacherTab"
                    class="role-tab flex-1 py-2.5 px-5 rounded-full text-sm font-semibold text-ink-700 hover:text-ink-900 flex items-center justify-center space-x-2"
                    onclick="selectRole('teacher')">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
                    </svg>
                    <span>Teacher</span>
                </button>
            </div>

            <input type="hidden" id="selectedRole" value="student">

            <!-- Login Form -->
            <form id="loginForm" class="space-y-4">
                <!-- Email Input -->
                <div class="space-y-2">
                    <label for="email" class="block text-sm font-semibold text-ink-700">
                        Email Address
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                            </svg>
                        </div>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            class="w-full pl-11 pr-4 py-3 bg-white border-2 border-ink-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-forest-600 input-focus-effect transition-all text-ink-900 placeholder-ink-400"
                            placeholder="Enter your email address"
                            autocomplete="email"
                        >
                    </div>
                </div>

                <!-- Password Input -->
                <div class="space-y-2">
                    <label for="password" class="block text-sm font-semibold text-ink-700">
                        Password
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            class="w-full pl-11 pr-12 py-3 bg-white border-2 border-ink-900 rounded-xl focus:outline-none focus:ring-2 focus:ring-forest-600 input-focus-effect transition-all text-ink-900 placeholder-ink-400"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                        >
                        <button type="button" onclick="togglePassword()" class="absolute inset-y-0 right-0 pr-4 flex items-center password-toggle text-gray-400 hover:text-forest-600 transition-colors">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg id="eyeOffIcon" class="w-5 h-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Remember Me and Forgot Password -->
                <div class="flex items-center justify-between">
                    <label class="flex items-center cursor-pointer group">
                        <input
                            type="checkbox"
                            id="remember"
                            name="remember"
                            class="w-5 h-5 rounded border-ink-300 text-forest-600 focus:ring-forest-600 focus:ring-offset-0 transition-colors cursor-pointer"
                        >
                        <span class="ml-3 text-sm text-ink-600 group-hover:text-ink-900 transition-colors">
                            Remember me
                        </span>
                    </label>
                    <a href="reset-password.html" class="text-sm font-semibold text-forest-600 hover:text-forest-800 transition-colors">
                        Forgot password?
                    </a>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden p-4 bg-red-50 border border-red-200 rounded-xl">
                    <div class="flex items-center space-x-3">
                        <svg class="w-5 h-5 text-red-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                        </svg>
                        <p id="errorText" class="text-sm text-red-600 font-medium"></p>
                    </div>
                </div>

                <!-- Submit Button -->
                <button
                    type="submit"
                    id="loginButton"
                    class="w-full py-3.5 px-6 rounded-full text-white font-semibold text-base flex items-center justify-center space-x-2 bg-forest-600 border-2 border-ink-900 shadow-[4px_4px_0_0_#1c1b1a] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[5px_5px_0_0_#1c1b1a] active:translate-x-1 active:translate-y-1 active:shadow-none transition-all"
                >
                    <span>Sign In as</span>
                    <span id="roleLabel">Student</span>
                    <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                    </svg>
                </button>
            </form>

            <!-- Loading Indicator -->
            <div id="loadingIndicator" class="hidden mt-6">
                <div class="flex items-center justify-center space-x-3">
                    <div class="w-6 h-6 border-2 border-forest-600 border-t-transparent rounded-full animate-spin"></div>
                    <span class="text-ink-600 font-medium">Signing you in...</span>
                </div>
            </div>

            <!-- Divider -->
            <div class="mt-6 flex items-center">
                <div class="flex-1 h-px divider-line"></div>
                <span class="px-4 text-sm text-ink-500 font-medium">New here?</span>
                <div class="flex-1 h-px divider-line"></div>
            </div>

            <!-- Register Link -->
            <div class="mt-4">
                <a href="register.html"
                    class="w-full py-3 px-6 rounded-full text-ink-900 font-semibold text-base flex items-center justify-center space-x-2 border-2 border-ink-900 shadow-[3px_3px_0_0_#1c1b1a] hover:-translate-x-0.5 hover:-translate-y-0.5 hover:shadow-[4px_4px_0_0_#1c1b1a] active:translate-x-0.5 active:translate-y-0.5 active:shadow-none transition-all bg-white">
                    <span>Create an Account</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/>
                    </svg>
                </a>
            </div>

            <!-- Back to Home -->
            <div class="mt-4 text-center">
                <a href="index.html" class="text-sm text-ink-500 hover:text-ink-900 transition-colors">
                    ← Back to Home
                </a>
            </div>

            <!-- Footer -->
            <div class="mt-6 text-center">
                <div class="flex items-center justify-center space-x-3 text-xs text-ink-400">
                    <a href="contact.html" class="hover:text-ink-700 transition-colors">Contact Support</a>
                    <span>•</span>
                    <a href="terms.html" class="hover:text-ink-700 transition-colors">Terms</a>
                    <span>•</span>
                    <a href="privacy.html" class="hover:text-ink-700 transition-colors">Privacy</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="shared/js/runtime-config.js"></script>
    <script src="shared/js/config.js"></script>
    <script src="shared/js/utils.js"></script>
    <script src="shared/js/supabase.js"></script>
    <script src="shared/js/auth.js"></script>
    <script>
        // Password visibility toggle
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            const eyeOffIcon = document.getElementById('eyeOffIcon');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('hidden');
                eyeOffIcon.classList.add('hidden');
            }
        }

        // Role selection
        function selectRole(role) {
            document.getElementById('selectedRole').value = role;
            document.getElementById('roleLabel').textContent = role === 'student' ? 'Student' : 'Teacher';

            const studentTab = document.getElementById('studentTab');
            const teacherTab = document.getElementById('teacherTab');

            if (role === 'student') {
                studentTab.classList.add('active');
                studentTab.classList.remove('text-ink-700', 'hover:text-ink-900');
                teacherTab.classList.remove('active');
                teacherTab.classList.add('text-ink-700', 'hover:text-ink-900');
            } else {
                teacherTab.classList.add('active');
                teacherTab.classList.remove('text-ink-700', 'hover:text-ink-900');
                studentTab.classList.remove('active');
                studentTab.classList.add('text-ink-700', 'hover:text-ink-900');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const loginForm = document.getElementById('loginForm');
            const loginButton = document.getElementById('loginButton');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const errorMessage = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');

            loginForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const selectedRole = document.getElementById('selectedRole').value;

                loginButton.disabled = true;
                loginButton.innerHTML = `
                    <div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin mr-2"></div>
                    <span>Signing in...</span>
                `;
                loginButton.classList.add('opacity-75', 'cursor-not-allowed');
                loadingIndicator.classList.remove('hidden');
                errorMessage.classList.add('hidden');

                try {
                    const user = await login(email, password);

                    if (user) {
                        if (user.role !== selectedRole) {
                            showError(`This account is registered as a ${user.role}, not a ${selectedRole}. Please select the correct role.`);
                            await logout();
                            return;
                        }
                        redirectToDashboard();
                    } else {
                        const lastError = typeof getLastLoginError === 'function' ? getLastLoginError() : null;
                        showError(lastError?.message || 'Invalid email or password. Please try again.');
                    }
                } catch (error) {
                    showError('Login failed: ' + error.message);
                } finally {
                    loginButton.disabled = false;
                    const roleLabel = document.getElementById('selectedRole').value === 'student' ? 'Student' : 'Teacher';
                    loginButton.innerHTML = `
                        <span>Sign In as</span>
                        <span id="roleLabel">${roleLabel}</span>
                        <svg class="w-5 h-5 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                        </svg>
                    `;
                    loginButton.classList.remove('opacity-75', 'cursor-not-allowed');
                    loadingIndicator.classList.add('hidden');
                }
            });

            function showError(message) {
                errorText.textContent = message;
                errorMessage.classList.remove('hidden');
                // Scroll to error message
                errorMessage.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // Add input focus animations
            const inputs = document.querySelectorAll('input[type="email"], input[type="password"]');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentElement.classList.add('ring-2', 'ring-forest-600/20', 'rounded-xl');
                });
                input.addEventListener('blur', function() {
                    this.parentElement.classList.remove('ring-2', 'ring-forest-600/20', 'rounded-xl');
                });
            });
        });
    </script>
</body>
</html>
