<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../dist/styles.css">
    <script src="../shared/js/device.js"></script>
    <link rel="icon" type="image/png" href="../Logo/MATHURO-LOGO-v2.png">
    <title>Tutorial Videos - MathTuro LMS</title>
    <script src="../shared/js/supabase-lib.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }

        @media (max-width: 768px) {

            .video-card,
            .lesson-card,
            .tutorial-card {
                max-width: 100% !important;
                min-width: 0 !important;
                width: 100% !important;
                margin: 0 0 1.5rem 0 !important;
                padding: 1.25rem !important;
                box-sizing: border-box;
            }

            .videos-grid,
            .cards-row {
                display: flex !important;
                flex-direction: column !important;
                gap: 1.5rem !important;
            }
        }

        .gradient-text {
            background: linear-gradient(135deg, #005801 0%, #22c55e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .glass-sidebar {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
        }

        .sidebar-link {
            transition: all 0.2s ease;
        }

        .sidebar-link:hover,
        .sidebar-link.active {
            background: linear-gradient(135deg, #005801 0%, #006B01 100%);
            color: white;
        }

        .sidebar-link.active {
            box-shadow: 0 4px 15px rgba(0, 88, 1, 0.3);
        }

        .video-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .video-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -12px rgba(0, 88, 1, 0.15);
        }

        .video-card:hover .play-overlay {
            opacity: 1;
        }

        .play-overlay {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .category-tab {
            transition: all 0.2s ease;
        }

        .category-tab.active {
            background: linear-gradient(135deg, #005801 0%, #006B01 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 88, 1, 0.3);
        }

        .video-player-container {
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1a 100%);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #005801;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #004601;
        }
    </style>
    <link rel="stylesheet" href="../shared/css/base.css">
</head>

<body class="bg-gray-50 min-h-screen">
    <!-- Mobile bottom navigation container for student role -->
    <div data-include="nav-mobile-student" data-depth="../"></div>

    <!-- Mobile Menu Overlay -->
    <div id="mobileOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden lg:hidden"></div>

    <!-- Sidebar -->
    <aside id="sidebar"
        class="fixed left-0 top-0 h-full w-72 glass-sidebar border-r border-gray-200 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 overflow-y-auto"></aside>

    <!-- Main Content -->
    <main class="lg:ml-72 min-h-screen">
        <!-- Top Header -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
            <div class="flex items-center justify-between px-4 lg:px-8 py-4">
                <!-- Mobile Menu Button -->
                <button id="mobileMenuBtn" class="lg:hidden p-2 text-gray-600 hover:text-brand rounded-lg">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>

                <!-- Page Title -->
                <div class="flex-1 lg:flex-none">
                    <h1 class="text-xl lg:text-2xl font-bold text-gray-800">Tutorial Videos</h1>
                    <p class="text-sm text-gray-500 hidden sm:block">Learn with video guides and tutorials</p>
                </div>

                <!-- Search -->
                <div class="flex items-center space-x-3">
                    <div class="hidden md:flex items-center space-x-2 bg-gray-100 rounded-xl px-4 py-2">
                        <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search videos..."
                            class="bg-transparent border-none outline-none text-sm w-48">
                    </div>

                    <!-- Back button -->
                    <a href="/student/dashboard.html" id="backBtn"
                        class="flex items-center space-x-2 px-4 py-2 bg-gray-100 rounded-xl text-gray-600 hover:bg-gray-200 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        <span class="hidden sm:inline">Back</span>
                    </a>
                </div>
            </div>
        </header>

        <!-- Video Content -->
        <div class="p-4 lg:p-8">
            <!-- Featured Video Player -->
            <div id="videoPlayerSection" class="hidden mb-8">
                <div class="bg-white rounded-2xl overflow-hidden border border-gray-100 shadow-sm">
                    <div class="video-player-container aspect-video relative">
                        <iframe id="videoPlayer" class="w-full h-full" frameborder="0" allowfullscreen
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
                        <div id="videoPlaceholder"
                            class="absolute inset-0 flex items-center justify-center bg-gradient-to-br from-brand/10 to-green-500/10">
                            <div class="text-center">
                                <div
                                    class="w-20 h-20 bg-white rounded-full flex items-center justify-center shadow-lg mb-4 mx-auto">
                                    <svg class="w-10 h-10 text-brand ml-2" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M8 5v14l11-7z" />
                                    </svg>
                                </div>
                                <p class="text-gray-600 font-medium">Select a video to play</p>
                            </div>
                        </div>
                    </div>
                    <div class="p-6">
                        <h2 id="videoTitle" class="text-xl font-bold text-gray-800 mb-2">Video Title</h2>
                        <p id="videoDescription" class="text-gray-600 mb-4">Video description will appear here.</p>
                        <div class="flex items-center space-x-4 text-sm text-gray-500">
                            <span id="videoQuarter" class="px-3 py-1 bg-blue-50 text-blue-700 rounded-full">All
                                Quarters</span>
                            <span id="videoDuration" class="flex items-center space-x-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                                </svg>
                                <span>5 min</span>
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex flex-wrap gap-2 mb-6" id="quarterTabs">
                <button onclick="filterByQuarter('all')"
                    class="quarter-tab active px-4 py-2 rounded-xl text-sm font-medium bg-brand text-white hover:bg-brand-dark"
                    data-quarter="all">
                    All Videos
                </button>
                <button onclick="filterByQuarter('1')"
                    class="quarter-tab px-4 py-2 rounded-xl text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200"
                    data-quarter="1">
                    Quarter 1
                </button>
                <button onclick="filterByQuarter('2')"
                    class="quarter-tab px-4 py-2 rounded-xl text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200"
                    data-quarter="2">
                    Quarter 2
                </button>
                <button onclick="filterByQuarter('3')"
                    class="quarter-tab px-4 py-2 rounded-xl text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200"
                    data-quarter="3">
                    Quarter 3
                </button>
                <button onclick="filterByQuarter('4')"
                    class="quarter-tab px-4 py-2 rounded-xl text-sm font-medium bg-gray-100 text-gray-600 hover:bg-gray-200"
                    data-quarter="4">
                    Quarter 4
                </button>
            </div>

            <!-- Videos Grid -->
            <div id="videosGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Videos will be loaded here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden text-center py-16">
                <div class="w-20 h-20 bg-gray-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-10 h-10 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z" />
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-2">No videos found</h3>
                <p class="text-gray-500 mb-4">Try adjusting your search or filter criteria</p>
                <button onclick="filterByQuarter('all')"
                    class="px-6 py-2 bg-brand text-white rounded-xl hover:bg-brand-dark">View All Videos</button>
            </div>

            <!-- Add Video Section (Admin/Teacher Only) -->
            <div id="addVideoSection" class="hidden mt-8 bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
                <h3 class="text-lg font-bold text-gray-800 mb-4">Add New Tutorial Video</h3>
                <form id="addVideoForm" class="grid md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Video Title</label>
                        <input type="text" id="newVideoTitle" required
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand"
                            placeholder="Enter video title">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Quarter</label>
                        <select id="newVideoQuarter"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand">
                            <option value="">All Quarters</option>
                            <option value="1">Quarter 1</option>
                            <option value="2">Quarter 2</option>
                            <option value="3">Quarter 3</option>
                            <option value="4">Quarter 4</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">YouTube/Video URL</label>
                        <input type="url" id="newVideoUrl" required
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand"
                            placeholder="https://www.youtube.com/watch?v=...">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                        <textarea id="newVideoDescription" rows="3"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand resize-none"
                            placeholder="Brief description of the video"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Duration</label>
                        <input type="text" id="newVideoDuration"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand"
                            placeholder="e.g., 5:30">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Thumbnail URL (Optional)</label>
                        <input type="url" id="newVideoThumbnail"
                            class="w-full px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-brand"
                            placeholder="https://...">
                    </div>
                    <div class="md:col-span-2 flex items-center space-x-4">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" id="newVideoFeatured"
                                class="w-4 h-4 text-brand rounded focus:ring-brand">
                            <span class="text-sm text-gray-700">Featured Video</span>
                        </label>
                    </div>
                    <div class="md:col-span-2">
                        <button type="submit"
                            class="w-full py-3 bg-brand text-white rounded-xl font-semibold hover:bg-brand-dark transition-colors">
                            Add Video
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
        <div class="bg-white rounded-2xl p-8 text-center shadow-2xl">
            <div class="relative w-16 h-16 mx-auto mb-4">
                <div class="absolute inset-0 border-4 border-brand/20 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-brand border-t-transparent rounded-full animate-spin">
                </div>
            </div>
            <p class="text-gray-600 font-medium">Loading videos...</p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../shared/js/config.js"></script>
    <script src="../shared/js/utils.js"></script>
    <script src="../shared/js/supabase.js"></script>
    <script src="../shared/js/auth.js"></script>

    <script>
        // Global variables
        let currentUser = null;
        let allVideos = [];
        let currentQuarter = 'all';
        let currentVideo = null;

        // DOM Elements
        const loadingOverlay = document.getElementById('loadingOverlay');
        const mobileMenuBtn = document.getElementById('mobileMenuBtn');
        const mobileOverlay = document.getElementById('mobileOverlay');
        const sidebar = document.getElementById('sidebar');
        const searchInput = document.getElementById('searchInput');

        // Initialize
        document.addEventListener('DOMContentLoaded', async function () {
            try {
                // Check authentication
                currentUser = await checkAuthSession();

                if (!currentUser) {
                    redirectToLogin();
                    return;
                }

                // Update UI based on role
                updateUserInfo(currentUser);
                updateUIForRole(currentUser.role);

                if (currentUser.role === 'student') {
                    document.documentElement.setAttribute('data-portal', 'student');
                    document.documentElement.setAttribute('data-native-mobile', 'true');
                    document.body.classList.add('has-mobile-nav');

                    const mobileNav = document.getElementById('mobileNavContainer');
                    if (mobileNav) {
                        mobileNav.innerHTML = '<div data-include="nav-mobile-student" data-depth="../"></div>';
                        if (window.loadIncludes) {
                            window.loadIncludes();
                        }
                    }

                    if (typeof syncStudentScopeFromAuth === 'function') {
                        await syncStudentScopeFromAuth(currentUser.id);
                    }
                }

                // Load videos
                await loadVideos();

                // Check for video ID in URL
                const urlParams = new URLSearchParams(window.location.search);
                const videoId = urlParams.get('video');
                if (videoId) {
                    const video = allVideos.find(v => v.id == videoId);
                    if (video) playVideo(video);
                }

                // Setup event listeners
                setupEventListeners();

            } catch (error) {
                console.error('Initialization error:', error);
                showToast('Failed to load page. Please try again.', 'error');
            } finally {
                loadingOverlay.classList.add('hidden');
            }
        });

        // Update user info in sidebar
        function updateUserInfo(user) {
            const initials = user.fullName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
            const userInitialsEl = document.getElementById('userInitials');
            const sidebarUserNameEl = document.getElementById('sidebarUserName');
            const userRoleEl = document.getElementById('userRole');

            if (userInitialsEl) userInitialsEl.textContent = initials;
            if (sidebarUserNameEl) sidebarUserNameEl.textContent = user.fullName;
            if (userRoleEl) userRoleEl.textContent = user.role;

            // Update dashboard link based on role
            const dashboardLink = document.getElementById('dashboardLink');
            const backBtn = document.getElementById('backBtn');
            if (user.role === 'teacher') {
                dashboardLink.href = '/teacher/dashboard.html';
                backBtn.href = '/teacher/dashboard.html';
            } else if (user.role === 'admin') {
                dashboardLink.href = '/admin/dashboard.html';
                backBtn.href = '/admin/dashboard.html';
            }
        }

        // Show/hide admin features based on role
        function updateUIForRole(role) {
            if (role === 'teacher' || role === 'admin') {
                document.getElementById('addVideoSection').classList.remove('hidden');
            }
        }

        function normalizeQuarterValue(value) {
            if (value === null || value === undefined || value === '') return '';
            const quarter = String(value).trim().replace(/[^0-9]/g, '');
            return ['1', '2', '3', '4'].includes(quarter) ? quarter : '';
        }

        function getQuarterLabel(value) {
            const quarter = normalizeQuarterValue(value);
            return quarter ? `Quarter ${quarter}` : 'All Quarters';
        }

        // Load videos from database
        async function loadVideos() {
            try {
                const { data: dbVideos, error } = await getSupabase()
                    .from('videos')
                    .select('*')
                    .eq('is_published', true)
                    .order('created_at', { ascending: false });

                if (error) {
                    throw error;
                }

                allVideos = (dbVideos || []).map(v => ({
                    id: v.id,
                    title: v.title,
                    description: v.description || '',
                    quarter: normalizeQuarterValue(v.quarter ?? v.module_quarter ?? v.quarter_number),
                    video_url: v.video_url,
                    thumbnail_url: v.thumbnail_url || getYouTubeThumbnail(v.video_url),
                    duration: v.duration || null,
                    is_featured: Boolean(v.is_featured),
                    views: v.view_count || 0,
                    teacher: 'MathTuro',
                    grade_level: v.grade_level || ''
                }));

                if (allVideos.length === 0) {
                    const { data: tutorialVideos, error: tutorialVideosError } = await getSupabase()
                        .from('tutorial_videos')
                        .select('*')
                        .eq('is_active', true)
                        .order('is_featured', { ascending: false })
                        .order('order', { ascending: true })
                        .order('created_at', { ascending: false });

                    if (tutorialVideosError) {
                        throw tutorialVideosError;
                    }

                    allVideos = (tutorialVideos || []).map(v => ({
                        id: v.id,
                        title: v.title,
                        description: v.description || '',
                        quarter: normalizeQuarterValue(v.quarter ?? v.module_quarter ?? v.quarter_number),
                        video_url: v.video_url,
                        thumbnail_url: v.thumbnail_url || getYouTubeThumbnail(v.video_url),
                        duration: v.duration || null,
                        is_featured: Boolean(v.is_featured),
                        views: 0,
                        teacher: 'MathTuro',
                        grade_level: ''
                    }));
                }

                renderVideos();

            } catch (error) {
                console.error('Failed to load published videos:', error);
                allVideos = [];
                renderVideos();
                showToast('Unable to load videos from database. Please try again later.', 'error');
            }
        }

        // Get YouTube thumbnail
        function getYouTubeThumbnail(url) {
            if (!url) return 'https://via.placeholder.com/320x180?text=Video';
            const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]+)/);
            if (match) return `https://img.youtube.com/vi/${match[1]}/mqdefault.jpg`;
            return 'https://via.placeholder.com/320x180?text=Video';
        }

        function normalizeVideoUrlForEmbed(rawUrl) {
            if (!rawUrl) return null;

            const value = String(rawUrl).trim();
            if (!value) return null;

            let parsed;
            try {
                parsed = new URL(value);
            } catch {
                return null;
            }

            const host = parsed.hostname.toLowerCase();

            if (host.includes('youtube.com')) {
                if (parsed.pathname === '/watch') {
                    const videoId = parsed.searchParams.get('v');
                    return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0` : null;
                }

                const embedMatch = parsed.pathname.match(/\/embed\/([a-zA-Z0-9_-]+)/);
                if (embedMatch?.[1]) {
                    return `https://www.youtube.com/embed/${embedMatch[1]}?autoplay=1&rel=0`;
                }

                const shortMatch = parsed.pathname.match(/\/shorts\/([a-zA-Z0-9_-]+)/);
                if (shortMatch?.[1]) {
                    return `https://www.youtube.com/embed/${shortMatch[1]}?autoplay=1&rel=0`;
                }
            }

            if (host === 'youtu.be') {
                const videoId = parsed.pathname.replace(/^\//, '').split('/')[0];
                return videoId ? `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0` : null;
            }

            if (parsed.protocol === 'http:' || parsed.protocol === 'https:') {
                return parsed.href;
            }

            return null;
        }

        // Render videos grid
        function renderVideos() {
            const grid = document.getElementById('videosGrid');
            const emptyState = document.getElementById('emptyState');

            let filteredVideos = allVideos;

            if (currentQuarter !== 'all') {
                filteredVideos = filteredVideos.filter(v => normalizeQuarterValue(v.quarter) === currentQuarter);
            }

            // Filter by search
            const searchTerm = searchInput?.value.toLowerCase() || '';
            if (searchTerm) {
                filteredVideos = filteredVideos.filter(v =>
                    v.title.toLowerCase().includes(searchTerm) ||
                    v.description?.toLowerCase().includes(searchTerm)
                );
            }

            if (filteredVideos.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');

            grid.innerHTML = filteredVideos.map(video => {
                const gradient = 'from-brand/10 to-green-500/10';

                return `
                    <div class="video-card bg-white rounded-xl overflow-hidden border border-gray-100 cursor-pointer" onclick="playVideo(${JSON.stringify(video).replace(/"/g, '&quot;')})">
                        <div class="aspect-video relative bg-gradient-to-br ${gradient}">
                            ${video.thumbnail_url ?
                        `<img src="${video.thumbnail_url}" alt="${escapeHtml(video.title)}" class="w-full h-full object-cover">` :
                        `<div class="absolute inset-0 flex items-center justify-center">
                                    <svg class="w-12 h-12 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                    </svg>
                                </div>`
                    }
                            <div class="play-overlay absolute inset-0 bg-black/40">
                                <div class="play-button w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-lg">
                                    <svg class="w-6 h-6 text-brand" fill="currentColor" viewBox="0 0 24 24">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                </div>
                            </div>
                            ${video.duration ? `<span class="absolute bottom-2 right-2 bg-black/70 text-white text-xs px-2 py-1 rounded">${video.duration}</span>` : ''}
                            ${video.is_featured ? `<span class="absolute top-2 left-2 bg-yellow-500 text-white text-xs px-2 py-1 rounded-full">⭐ Featured</span>` : ''}
                        </div>
                        <div class="p-4">
                            <div class="flex items-start justify-between mb-2">
                                <h3 class="font-semibold text-gray-800 line-clamp-2 flex-1">${escapeHtml(video.title)}</h3>
                            </div>
                            <p class="text-sm text-gray-500 line-clamp-2 mb-3">${escapeHtml(video.description || '')}</p>
                            <div class="flex items-center justify-start gap-2 flex-wrap">
                                <span class="inline-flex items-center px-2 py-1 rounded-full text-xs font-medium bg-blue-50 text-blue-700">
                                    ${getQuarterLabel(video.quarter)}
                                </span>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Play a video
        function playVideo(video) {
            currentVideo = video;

            const playerSection = document.getElementById('videoPlayerSection');
            const player = document.getElementById('videoPlayer');
            const placeholder = document.getElementById('videoPlaceholder');

            // Update video info
            document.getElementById('videoTitle').textContent = video.title;
            document.getElementById('videoDescription').textContent = video.description || 'No description available.';
            document.getElementById('videoDuration').querySelector('span:last-child').textContent = video.duration || 'N/A';
            document.getElementById('videoQuarter').textContent = getQuarterLabel(video.quarter);

            // Set video source safely
            const embedUrl = normalizeVideoUrlForEmbed(video.video_url);
            if (!embedUrl) {
                showToast('Invalid or unsupported video URL.', 'error');
                return;
            }

            player.src = embedUrl;
            placeholder.classList.add('hidden');
            playerSection.classList.remove('hidden');

            // Scroll to player
            playerSection.scrollIntoView({ behavior: 'smooth' });

            // Track video view (optional)
            trackVideoView(video.id);
        }

        // Track video view
        async function trackVideoView(videoId) {
            try {
                await getSupabase()
                    .from('video_views')
                    .upsert({
                        video_id: videoId,
                        student_id: currentUser.id,
                        viewed_at: new Date().toISOString()
                    }, {
                        onConflict: 'video_id,student_id'
                    });
            } catch (error) {
                // Silently fail - not critical
            }
        }

        function filterByQuarter(quarter) {
            currentQuarter = quarter || 'all';

            document.querySelectorAll('.quarter-tab').forEach(tab => {
                const isActive = (tab.dataset.quarter || 'all') === currentQuarter;
                tab.classList.toggle('active', isActive);
                tab.classList.toggle('bg-brand', isActive);
                tab.classList.toggle('text-white', isActive);
                tab.classList.toggle('hover:bg-brand-dark', isActive);
                tab.classList.toggle('bg-gray-100', !isActive);
                tab.classList.toggle('text-gray-600', !isActive);
                tab.classList.toggle('hover:bg-gray-200', !isActive);
            });

            renderVideos();
        }

        // Setup event listeners
        function setupEventListeners() {
            // Mobile menu toggle
            mobileMenuBtn.addEventListener('click', () => {
                sidebar.classList.toggle('-translate-x-full');
                mobileOverlay.classList.toggle('hidden');
            });

            mobileOverlay.addEventListener('click', () => {
                sidebar.classList.add('-translate-x-full');
                mobileOverlay.classList.add('hidden');
            });

            // Search
            if (searchInput) {
                searchInput.addEventListener('input', debounce(() => {
                    renderVideos();
                }, 300));
            }

            // Logout
            document.getElementById('logoutButton').addEventListener('click', async () => {
                if (await logout()) {
                    redirectToLogin();
                }
            });

            // Add video form (admin/teacher)
            const addVideoForm = document.getElementById('addVideoForm');
            if (addVideoForm) {
                addVideoForm.addEventListener('submit', handleAddVideo);
            }
        }

        // Handle add video form submission
        async function handleAddVideo(e) {
            e.preventDefault();

            const title = document.getElementById('newVideoTitle').value.trim();
            const videoUrl = document.getElementById('newVideoUrl').value.trim();
            const description = document.getElementById('newVideoDescription').value.trim();
            const duration = document.getElementById('newVideoDuration').value.trim();
            const thumbnailUrl = document.getElementById('newVideoThumbnail').value.trim();
            const quarter = normalizeQuarterValue(document.getElementById('newVideoQuarter').value);
            const isFeatured = document.getElementById('newVideoFeatured').checked;

            if (!title || !videoUrl) {
                showToast('Please fill in all required fields', 'error');
                return;
            }

            try {
                const { data, error } = await getSupabase()
                    .from('videos')
                    .insert({
                        title,
                        quarter: quarter || null,
                        video_url: videoUrl,
                        description,
                        duration,
                        thumbnail_url: thumbnailUrl || null,
                        is_featured: isFeatured,
                        is_published: true,
                        teacher_id: currentUser.id
                    })
                    .select()
                    .single();

                if (error) throw error;

                allVideos.unshift({
                    id: data.id,
                    title: data.title,
                    description: data.description || '',
                    quarter: normalizeQuarterValue(data.quarter ?? data.module_quarter ?? data.quarter_number),
                    video_url: data.video_url,
                    thumbnail_url: data.thumbnail_url || getYouTubeThumbnail(data.video_url),
                    duration: data.duration || null,
                    is_featured: Boolean(data.is_featured),
                    views: data.view_count || 0,
                    teacher: 'MathTuro',
                    grade_level: data.grade_level || ''
                });
                renderVideos();

                // Reset form
                e.target.reset();
                showToast('Video added successfully!', 'success');

            } catch (error) {
                console.error('Error adding video:', error);
                showToast('Failed to add video. Please try again.', 'error');
            }
        }

        // Debounce helper
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // Escape HTML helper
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Show toast notification
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `fixed bottom-4 right-4 px-6 py-3 rounded-xl shadow-lg z-50 ${type === 'success' ? 'bg-green-500' : type === 'error' ? 'bg-red-500' : 'bg-brand'
                } text-white font-medium`;
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>

    <script src="../shared/js/utils.js"></script>
