<script>
  // Active tab highlighting
  (function () {
    var page = window.location.pathname.split('/').pop() || 'dashboard.html';
    var tabMap = {
      'dashboard.html': 'dashboard',
      'users.html': 'users',
      'analytics.html': 'analytics',
      'settings.html': 'settings',
      'grade-levels.html': 'more',
      'sections.html': 'more',
      'manage-modules.html': 'more',
      'manage-quizzes.html': 'more',
      'manage-videos.html': 'more',
      'lesson-plan.html': 'more',
      'activity.html': 'more',
      'system-status.html': 'more',
    };
    var activeTab = tabMap[page] || null;
    if (activeTab) {
      var link = document.querySelector('#mobileTabBar [data-tab="' + activeTab + '"]');
      if (link) {
        link.classList.add('text-brand');
        link.classList.remove('text-gray-500');
        link.setAttribute('aria-current', 'page');
      }
    }
    document.body.classList.add('has-mobile-nav');
  })();

  // More sheet toggle
  function toggleMoreSheet() {
    var sheet = document.getElementById('moreSheet');
    var backdrop = document.getElementById('moreSheetBackdrop');
    var btn = document.getElementById('moreTabBtn');
    var isOpen = !sheet.classList.contains('translate-y-full');
    if (isOpen) {
      closeMoreSheet();
    } else {
      sheet.classList.remove('translate-y-full');
      backdrop.classList.remove('hidden');
      btn.setAttribute('aria-expanded', 'true');
    }
  }

  function closeMoreSheet() {
    var sheet = document.getElementById('moreSheet');
    var backdrop = document.getElementById('moreSheetBackdrop');
    var btn = document.getElementById('moreTabBtn');
    sheet.classList.add('translate-y-full');
    backdrop.classList.add('hidden');
    btn.setAttribute('aria-expanded', 'false');
  }
</script>
