<!-- Mobile Bottom Tab Bar — Student -->
<!-- Hidden on desktop (lg+), fixed to bottom on mobile. This is the ONLY
     navigation on real touch phones below 768px — device.js hides the
     sidebar/hamburger entirely via data-native-mobile="true", so every
     real student destination must be reachable from here, either as a
     direct tab or inside the More sheet. -->
<nav id="mobileTabBar" aria-label="Main navigation"
  class="lg:hidden fixed bottom-0 left-0 right-0 z-50 flex items-stretch"
  style="padding-bottom: env(safe-area-inset-bottom, 0px);">

  <!-- Dashboard -->
  <a href="/student/dashboard.html"
    class="mobile-tab flex-1 flex flex-col items-center justify-center gap-0.5 text-xs font-medium no-underline"
    data-nav-key="dashboard">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
    </svg>
    <span class="mobile-tab-label">Dashboard</span>
  </a>

  <!-- Modules -->
  <a href="/student/modules.html"
    class="mobile-tab flex-1 flex flex-col items-center justify-center gap-0.5 text-xs font-medium no-underline"
    data-nav-key="modules">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
    </svg>
    <span class="mobile-tab-label">Modules</span>
  </a>

  <!-- Quizzes -->
  <a href="/student/quizzes.html"
    class="mobile-tab flex-1 flex flex-col items-center justify-center gap-0.5 text-xs font-medium no-underline"
    data-nav-key="quizzes">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
    </svg>
    <span class="mobile-tab-label">Quizzes</span>
  </a>

  <!-- Videos -->
  <a href="/student/tutorial-videos.html"
    class="mobile-tab flex-1 flex flex-col items-center justify-center gap-0.5 text-xs font-medium no-underline"
    data-nav-key="videos">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
    </svg>
    <span class="mobile-tab-label">Videos</span>
  </a>

  <!-- More: opens a sheet with Presentations + Progress, kept as two
       separate, distinctly-labeled destinations — not merged. -->
  <button type="button" id="moreTabTrigger"
    class="mobile-tab flex-1 flex flex-col items-center justify-center gap-0.5 text-xs font-medium no-underline"
    aria-haspopup="dialog" aria-expanded="false" aria-controls="moreSheet" aria-label="More options">
    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="5" cy="12" r="1.75" />
      <circle cx="12" cy="12" r="1.75" />
      <circle cx="19" cy="12" r="1.75" />
    </svg>
    <span class="mobile-tab-label">More</span>
    <span id="moreIndicatorDot" class="more-indicator-dot hidden" aria-hidden="true"></span>
  </button>
</nav>

<!-- More sheet backdrop + panel -->
<div id="moreSheetBackdrop" class="more-sheet-backdrop hidden lg:hidden"></div>
<div id="moreSheet" class="more-sheet hidden lg:hidden" role="dialog" aria-modal="true" aria-label="More navigation options" tabindex="-1">
  <div class="more-sheet-handle" aria-hidden="true"></div>
  <div class="more-sheet-header">
    <h2 class="more-sheet-title">More</h2>
    <button type="button" id="moreSheetClose" class="more-sheet-close" aria-label="Close">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>
  <div class="more-sheet-links">
    <a href="/student/presentations.html" class="more-sheet-link" data-nav-key="presentations">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
      </svg>
      <span>Presentations</span>
    </a>
    <a href="/student/dashboard.html#progress" class="more-sheet-link" data-nav-key="progress">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M9 19v-6a2 2 0 012-2h2a2 2 0 012 2v6m-9 0h10a2 2 0 002-2V9.5a1 1 0 00-.4-.8l-5-3.75a1 1 0 00-1.2 0l-5 3.75a1 1 0 00-.4.8V17a2 2 0 002 2z" />
      </svg>
      <span>Progress</span>
    </a>
  </div>
</div>

<script>
  (function () {
    var page = window.location.pathname.split('/').pop().toLowerCase() || 'dashboard.html';
    var hash = window.location.hash.toLowerCase();

    // Every real student destination maps to exactly one navKey, matching
    // the same vocabulary used by student/assets/js/sidebar.js so both nav
    // systems stay conceptually identical. Drill-down pages map to their
    // parent section's key.
    var pageNavKeyMap = {
      'dashboard.html': 'dashboard',
      '': 'dashboard',
      'modules.html': 'modules',
      'module-view.html': 'modules',
      'lesson-view.html': 'modules',
      'quizzes.html': 'quizzes',
      'take-quiz.html': 'quizzes',
      'tutorial-videos.html': 'videos',
      'presentations.html': 'presentations',
      'view-presentation.html': 'presentations'
    };
    var activeNavKey = hash === '#progress' ? 'progress' : (pageNavKeyMap[page] || null);

    // navKeys that live inside the More sheet rather than as a direct tab.
    var moreNavKeys = { presentations: true, progress: true };

    var tabBar = document.getElementById('mobileTabBar');
    var moreTrigger = document.getElementById('moreTabTrigger');
    var moreIndicatorDot = document.getElementById('moreIndicatorDot');
    var moreSheet = document.getElementById('moreSheet');
    var moreSheetBackdrop = document.getElementById('moreSheetBackdrop');
    var moreSheetClose = document.getElementById('moreSheetClose');

    if (activeNavKey && tabBar) {
      if (moreNavKeys[activeNavKey]) {
        // The More trigger gets the visual parent-active treatment only —
        // aria-current="page" belongs to the one real current destination
        // (the matching row inside the sheet below), not to both.
        if (moreTrigger) {
          moreTrigger.classList.add('active');
        }
        if (moreIndicatorDot) moreIndicatorDot.classList.remove('hidden');
        var activeSheetLink = moreSheet && moreSheet.querySelector('[data-nav-key="' + activeNavKey + '"]');
        if (activeSheetLink) {
          activeSheetLink.classList.add('active');
          activeSheetLink.setAttribute('aria-current', 'page');
        }
      } else {
        var activeTab = tabBar.querySelector('[data-nav-key="' + activeNavKey + '"]');
        if (activeTab) {
          activeTab.classList.add('active');
          activeTab.setAttribute('aria-current', 'page');
        }
      }
    }

    // Reserve body space for the fixed bottom bar.
    document.body.classList.add('has-mobile-nav');

    // --- More sheet open/close + focus management ---
    if (moreTrigger && moreSheet && moreSheetBackdrop && moreSheetClose) {
      var lastFocusedBeforeOpen = null;

      function getFocusableSheetElements() {
        return Array.prototype.slice.call(
          moreSheet.querySelectorAll('a[href], button:not([disabled])')
        );
      }

      function openMoreSheet() {
        lastFocusedBeforeOpen = document.activeElement;
        moreSheet.classList.remove('hidden');
        moreSheetBackdrop.classList.remove('hidden');
        moreTrigger.setAttribute('aria-expanded', 'true');
        var focusable = getFocusableSheetElements();
        if (focusable.length) {
          focusable[0].focus();
        } else {
          moreSheet.focus();
        }
        document.addEventListener('keydown', onSheetKeydown, true);
      }

      function closeMoreSheet() {
        moreSheet.classList.add('hidden');
        moreSheetBackdrop.classList.add('hidden');
        moreTrigger.setAttribute('aria-expanded', 'false');
        document.removeEventListener('keydown', onSheetKeydown, true);
        if (lastFocusedBeforeOpen && typeof lastFocusedBeforeOpen.focus === 'function') {
          lastFocusedBeforeOpen.focus();
        } else {
          moreTrigger.focus();
        }
      }

      function onSheetKeydown(e) {
        if (e.key === 'Escape') {
          e.preventDefault();
          closeMoreSheet();
          return;
        }
        if (e.key === 'Tab') {
          var focusable = getFocusableSheetElements();
          if (!focusable.length) return;
          var first = focusable[0];
          var last = focusable[focusable.length - 1];
          if (e.shiftKey && document.activeElement === first) {
            e.preventDefault();
            last.focus();
          } else if (!e.shiftKey && document.activeElement === last) {
            e.preventDefault();
            first.focus();
          }
        }
      }

      moreTrigger.addEventListener('click', function () {
        var isOpen = !moreSheet.classList.contains('hidden');
        if (isOpen) {
          closeMoreSheet();
        } else {
          openMoreSheet();
        }
      });

      moreSheetClose.addEventListener('click', closeMoreSheet);
      moreSheetBackdrop.addEventListener('click', closeMoreSheet);
    }
  })();
</script>
