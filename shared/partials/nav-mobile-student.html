<!-- Mobile Bottom Tab Bar — Student -->
<!-- Hidden on desktop (lg+), fixed to bottom on mobile -->
<!-- Simplified to 3 destinations (Phase 6): Core Learning absorbs Dashboard,
     Modules, and Tutorial Videos (all remain reachable as cards/links from
     the Core Learning landing page itself). Profile moved to the header
     avatar menu (see student/dashboard.html), matching the desktop pattern,
     instead of occupying a bottom-tab slot. -->
<nav id="mobileTabBar" aria-label="Main navigation"
  class="lg:hidden fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-200 flex items-stretch"
  style="padding-bottom: env(safe-area-inset-bottom, 0px);">

  <!-- Core Learning (Dashboard + Modules + Tutorial Videos) -->
  <a href="/student/dashboard.html"
    class="mobile-tab flex-1 flex flex-col items-center justify-center py-2 gap-0.5 text-xs font-medium text-gray-500 no-underline"
    data-tab="core-learning">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
    </svg>
    <span>Learning</span>
  </a>

  <!-- Quizzes -->
  <a href="/student/quizzes.html"
    class="mobile-tab flex-1 flex flex-col items-center justify-center py-2 gap-0.5 text-xs font-medium text-gray-500 no-underline"
    data-tab="quizzes">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
    </svg>
    <span>Quizzes</span>
  </a>

  <!-- Progress (opens the existing "My Learning Progress" modal on the
       dashboard, which also surfaces the Phase 5 leaderboard entry point).
       Links to dashboard.html#progress so it works from any student page,
       not only the dashboard itself. -->
  <a href="/student/dashboard.html#progress"
    class="mobile-tab flex-1 flex flex-col items-center justify-center py-2 gap-0.5 text-xs font-medium text-gray-500 no-underline"
    data-tab="progress">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M9 19v-6a2 2 0 012-2h2a2 2 0 012 2v6m-9 0h10a2 2 0 002-2V9.5a1 1 0 00-.4-.8l-5-3.75a1 1 0 00-1.2 0l-5 3.75a1 1 0 00-.4.8V17a2 2 0 002 2z" />
    </svg>
    <span>Progress</span>
  </a>
</nav>

<script>
  // Highlight the active tab based on the current page
  (function () {
    var page = window.location.pathname.split('/').pop() || 'dashboard.html';
    // Core Learning absorbs Dashboard, Modules, Lessons, and Tutorial Videos.
    var tabMap = {
      'dashboard.html': 'core-learning',
      'modules.html': 'core-learning',
      'module-view.html': 'core-learning',
      'lesson-view.html': 'core-learning',
      'tutorial-videos.html': 'core-learning',
      'quizzes.html': 'quizzes',
      'take-quiz.html': 'quizzes',
    };
    // The Progress tab always deep-links to dashboard.html#progress, so it
    // is never the "current page" by filename — it's highlighted separately
    // below when that hash is present, rather than through tabMap.
    var activeTab = window.location.hash === '#progress' ? 'progress' : (tabMap[page] || null);
    if (activeTab) {
      var link = document.querySelector('#mobileTabBar [data-tab="' + activeTab + '"]');
      if (link) {
        link.classList.add('text-brand');
        link.classList.add('active');
        link.classList.remove('text-gray-500');
        link.setAttribute('aria-current', 'page');
      }
    }
    // Add bottom padding to body so content isn't hidden behind tab bar
    document.body.classList.add('has-mobile-nav');
  })();
</script>
