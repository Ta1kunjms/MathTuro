<!-- More Sheet — slides up from bottom -->
<div id="moreSheetBackdrop"
     onclick="closeMoreSheet()"
     class="lg:hidden hidden fixed inset-0 bg-black/40 z-40"
     aria-hidden="true"></div>

<div id="moreSheet"
     role="dialog"
     aria-label="More options"
     aria-modal="true"
     class="lg:hidden fixed bottom-0 left-0 right-0 z-50 bg-white rounded-t-2xl shadow-2xl translate-y-full transition-transform duration-300 ease-out"
     style="padding-bottom: env(safe-area-inset-bottom, 0px);">
  <!-- Handle -->
  <div class="flex justify-center pt-3 pb-2">
    <div class="w-10 h-1 bg-gray-300 rounded-full"></div>
  </div>
  <div class="px-4 pb-4">
    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">More Options</p>
    <div class="grid grid-cols-3 gap-3">
      <a href="reports.html" class="flex flex-col items-center p-3 rounded-xl bg-gray-50 active:bg-gray-100 gap-2 no-underline">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span class="text-xs font-medium text-gray-700">Reports</span>
      </a>
      <a href="student-progress.html" class="flex flex-col items-center p-3 rounded-xl bg-gray-50 active:bg-gray-100 gap-2 no-underline">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="text-xs font-medium text-gray-700">Progress</span>
      </a>
      <a href="manage-quizzes.html" class="flex flex-col items-center p-3 rounded-xl bg-gray-50 active:bg-gray-100 gap-2 no-underline">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span class="text-xs font-medium text-gray-700">Quizzes</span>
      </a>
      <a href="manage-videos.html" class="flex flex-col items-center p-3 rounded-xl bg-gray-50 active:bg-gray-100 gap-2 no-underline">
        <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 10l4.553-2.069A1 1 0 0121 8.868v6.264a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"/>
        </svg>
        <span class="text-xs font-medium text-gray-700">Videos</span>

      <a href="lessonplan.html" class="flex flex-col items-center p-3 rounded-xl bg-gray-50 active:bg-gray-100 gap-2 no-underline">

          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <span class="text-xs font-medium text-gray-700">Lesson Plan</span>
      </a>
    </div>
  </div>
</div>

<script>
  // Active tab highlighting
  (function () {
    var page = window.location.pathname.split('/').pop() || 'dashboard.html';
    var tabMap = {
      'dashboard.html': 'dashboard',
      'submissions.html': 'submissions',
      'manage-modules.html': 'modules',
      'edit-module.html': 'modules',
      'profile.html': 'profile',
      'reports.html': 'more',
      'student-progress.html': 'more',
      'manage-quizzes.html': 'more',
      'manage-videos.html': 'more',
      'lessonplan.html': 'more',
    };
    var activeTab = tabMap[page] || null;
    if (activeTab) {
      var link = document.querySelector('#mobileTabBar [data-tab="' + activeTab + '"]');
      if (link) {
        link.classList.add('text-brand');
        link.classList.remove('text-gray-500');
        link.setAttribute('aria-current', 'page');
      }
    }
    document.body.classList.add('has-mobile-nav');
  })();

  // More sheet toggle
  function toggleMoreSheet() {
    var sheet = document.getElementById('moreSheet');
    var backdrop = document.getElementById('moreSheetBackdrop');
    var btn = document.getElementById('moreTabBtn');
    var isOpen = !sheet.classList.contains('translate-y-full');
    if (isOpen) {
      closeMoreSheet();
    } else {
      sheet.classList.remove('translate-y-full');
      backdrop.classList.remove('hidden');
      btn.setAttribute('aria-expanded', 'true');
    }
  }

  function closeMoreSheet() {
    var sheet = document.getElementById('moreSheet');
    var backdrop = document.getElementById('moreSheetBackdrop');
    var btn = document.getElementById('moreTabBtn');
    sheet.classList.add('translate-y-full');
    backdrop.classList.add('hidden');
    btn.setAttribute('aria-expanded', 'false');
  }
</script>
