<!DOCTYPE html>
<html lang="en" data-portal="student">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // Apply the saved font preference before first paint to avoid a flash
        // of the default font for returning users who enabled the dyslexia-
        // friendly toggle. Per-viewer UI preference only — localStorage, not
        // account data.
        (function () {
            try {
                if (localStorage.getItem('mathturo_font_pref') === 'dyslexic') {
                    document.documentElement.setAttribute('data-font', 'dyslexic');
                }
            } catch (e) { /* localStorage unavailable — fall back to default font */ }
        })();
    </script>
    <link rel="stylesheet" href="../dist/styles.css">
    <script src="../shared/js/device.js"></script>
    <link rel="icon" type="image/png" href="../Logo/MATHURO-LOGO-v2.png">
    <title>Browse Modules - MathTuro LMS</title>
    <script src="../shared/js/supabase-lib.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-family-display: 'Fredoka', system-ui, sans-serif;
            --font-family-base: 'Nunito', system-ui, sans-serif;
        }
        body {
            font-family: var(--font-family-base);
            color: #1c1b1a;
            background-color: #faf8f5;
        }
        h1, h2, h3, h4, .font-display {
            font-family: var(--font-family-display);
        }

        /* Sidebar chrome (injected by sidebar.js) — out of scope for this
           content-page redesign; see the backlog "Student Sidebar Visual
           Pass" planned after all four chains are done. */
        .gradient-text {
            color: #1b4332;
        }


        .sidebar-link {
            transition: all 0.2s ease;
        }

        .sidebar-link:hover, .sidebar-link.active {
            background: #1b4332;
            color: white;
        }

        .sidebar-link.active {
            box-shadow: 0 4px 15px rgba(27, 67, 50, 0.3);
        }

        .module-preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .module-preview-frame {
            width: 100%;
            height: 100%;
            border: 0;
            background: #fff;
        }

        .module-description {
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #1b4332; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #122d22; }
    </style>
    <link rel="stylesheet" href="../shared/css/base.css">
    <link rel="stylesheet" href="assets/css/student.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Mobile bottom navigation -->
    <div data-include="nav-mobile-student" data-depth="../"></div>

    <!-- Mobile Menu Overlay -->
    <div id="mobileOverlay" class="fixed inset-0 bg-black bg-opacity-50 z-40 hidden lg:hidden"></div>
    
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed left-0 top-0 h-full w-72 bg-white border-r border-gray-200 z-50 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 overflow-y-auto"></aside>

    <!-- Main Content -->
    <main class="lg:ml-72 min-h-screen">
        <!-- Top Header -->
        <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
            <div class="flex items-center justify-between px-4 lg:px-8 py-4">
                <!-- Mobile Menu Button -->
                <button id="mobileMenuBtn" class="lg:hidden p-2 text-gray-600 hover:text-forest-800 rounded-lg" aria-label="Open menu">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    </svg>
                </button>

                <!-- Page Title -->
                <div class="flex-1 lg:flex-none">
                     <h1 class="text-xl lg:text-2xl font-bold text-gray-800">Browse Modules</h1>
                    <p class="text-sm text-gray-500 hidden sm:block">Explore available learning modules</p>
                </div>

                <!-- Module Count -->
                <div class="flex items-center space-x-4">
                    <span class="learn-count-chip">
                        <span id="moduleCount">0</span> modules
                    </span>
                </div>
            </div>
        </header>

        <!-- Content Area -->
        <div class="p-4 lg:p-8">
            <!-- Search Bar -->
            <div class="mb-8">
                <div class="relative max-w-xl">
                    <label for="searchInput" class="sr-only">Search modules</label>
                    <input type="text" id="searchInput" placeholder="Search modules by title or description..."
                        class="w-full pl-12 pr-4 py-4 border-2 border-ink-900 rounded-2xl focus:ring-2 focus:ring-forest-600 focus:border-transparent bg-white">
                    <svg class="w-5 h-5 text-gray-400 absolute left-4 top-1/2 transform -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
            </div>

            <!-- Term Tabs (3 terms per DepEd mandate) -->
            <div class="flex flex-wrap gap-2 mb-3" id="quarterTabs">
                <button type="button" class="learn-quarter-tab active" data-quarter="all">All Terms</button>
                <button type="button" class="learn-quarter-tab" data-quarter="1">Term 1</button>
                <button type="button" class="learn-quarter-tab" data-quarter="2">Term 2</button>
                <button type="button" class="learn-quarter-tab" data-quarter="3">Term 3</button>
            </div>

            <!-- Status Filter Chips (Completed, Incompleted, Graded, Non-Graded) -->
            <div class="flex flex-wrap items-center gap-2 mb-8" id="statusFilterChips">
                <span class="text-xs font-bold text-ink-500 uppercase tracking-wider mr-1">Status:</span>
                <button type="button" class="learn-status-chip active px-3 py-1.5 rounded-full text-xs font-bold border-2 border-ink-900 bg-forest-600 text-white shadow-[2px_2px_0_0_#1c1b1a] transition-all" data-status="all">All</button>
                <button type="button" class="learn-status-chip px-3 py-1.5 rounded-full text-xs font-bold border-2 border-ink-900 bg-white text-ink-900 hover:bg-paper-100 shadow-[2px_2px_0_0_#1c1b1a] transition-all" data-status="completed">Completed</button>
                <button type="button" class="learn-status-chip px-3 py-1.5 rounded-full text-xs font-bold border-2 border-ink-900 bg-white text-ink-900 hover:bg-paper-100 shadow-[2px_2px_0_0_#1c1b1a] transition-all" data-status="incompleted">Incompleted</button>
                <button type="button" class="learn-status-chip px-3 py-1.5 rounded-full text-xs font-bold border-2 border-ink-900 bg-white text-ink-900 hover:bg-paper-100 shadow-[2px_2px_0_0_#1c1b1a] transition-all" data-status="graded">Graded</button>
                <button type="button" class="learn-status-chip px-3 py-1.5 rounded-full text-xs font-bold border-2 border-ink-900 bg-white text-ink-900 hover:bg-paper-100 shadow-[2px_2px_0_0_#1c1b1a] transition-all" data-status="non-graded">Non-Graded</button>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="text-center py-16">
                <div class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-forest-100 border-t-forest-600" aria-hidden="true"></div>
                <p class="mt-4 text-gray-600">Loading modules...</p>
            </div>

            <div id="modulesGrid" class="hidden grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 justify-start items-stretch">
                <!-- Modules will be loaded here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden learn-state-block">
                <div class="learn-state-icon" style="background: #f0f7f3; color: #1b4332;" aria-hidden="true">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                    </svg>
                </div>
                <h3 class="learn-state-title">No Modules Available</h3>
                <p class="learn-state-text">Check back later for new learning materials.</p>
                <a href="dashboard.html" class="learn-state-action">
                    <span>Back to Dashboard</span>
                </a>
            </div>
        </div>
    </main>

    <!-- Scripts -->
    <script src="../shared/js/includes.js"></script>

    <script src="../shared/js/runtime-config.js"></script>
    <script src="../shared/js/config.js"></script>
    <script src="../shared/js/utils.js"></script>
    <script src="../shared/js/supabase.js"></script>
    <script src="../shared/js/auth.js"></script>
    <script src="assets/js/sidebar.js"></script>
    <script src="assets/js/student.js"></script>
    
    <script>
        let currentUser = null;
        let modules = [];
        let studentAssignment = null;
        let activeQuarterFilter = 'all';
        let activeStatusFilter = 'all';

        document.addEventListener('DOMContentLoaded', async function() {
            try {
                currentUser = await checkAuthSession();
                if (!currentUser || currentUser.role !== 'student') {
                    redirectToLogin();
                    return;
                }
                
                updateUserDisplay(currentUser);
                setupEventListeners();
                await loadModules();
            } catch (error) {
                console.error('Init error:', error);
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            }
        });

        function updateUserDisplay(user) {
            const displayName = user.fullName || user.email || 'Student';
            const initials = displayName.split(' ').map(n => n[0]).join('').toUpperCase().slice(0, 2);
            const userNameEl = document.getElementById('sidebarUserName');
            const userInitialsEl = document.getElementById('userInitials');
            if (userNameEl) userNameEl.textContent = displayName;
            if (userInitialsEl) userInitialsEl.textContent = initials;
        }

        function normalizeGradeValue(value) {
            if (value === null || value === undefined || value === '') return null;
            const str = String(value).trim().toLowerCase();
            return str.startsWith('grade') ? str.replace(/^grade\s*/, '') : str;
        }

        function normalizeQuarterValue(value) {
            if (value === null || value === undefined || value === '') return '';
            const quarter = String(value).trim().replace(/[^0-9]/g, '');
            return ['1', '2', '3'].includes(quarter) ? quarter : (quarter === '4' ? '3' : '');
        }

        function getModuleQuarter(module) {
            return normalizeQuarterValue(module?.quarter ?? module?.module_quarter ?? module?.quarter_number);
        }

        // Curriculum order: Term -> Week -> teacher order_index (unset values last)
        function compareModuleSequence(a, b) {
            const key = m => [
                Number(getModuleQuarter(m)) || 99,
                Number(m.week_number) || 99,
                Number(m.order_index) || 9999
            ];
            const ka = key(a), kb = key(b);
            for (let i = 0; i < ka.length; i++) {
                if (ka[i] !== kb[i]) return ka[i] - kb[i];
            }
            return String(a.title || '').localeCompare(String(b.title || ''));
        }

        // Teacher-entered Lesson Objectives, one per line (leading bullets/numbers dropped)
        function getLessonObjectives(module) {
            return String(module?.lesson_objectives || '')
                .split(/\r?\n/)
                .map(line => line.replace(/^\s*(?:[-*•]|\d+[.)])\s*/, '').trim())
                .filter(Boolean);
        }

        function getQuarterLabel(module) {
            const quarter = getModuleQuarter(module);
            return quarter ? `Term ${quarter}` : '';
        }

        function resolveLearningMaterialUrl(rawPath) {
            if (!rawPath) return '';

            const value = String(rawPath).trim();
            if (!value) return '';

            if (/^https?:\/\//i.test(value)) {
                return value;
            }

            const normalizedPath = value
                .replace(/^\/+/, '')
                .replace(/^learning-materials\//i, '');

            if (!normalizedPath) return '';

            try {
                const { data } = getSupabase().storage.from('learning-materials').getPublicUrl(normalizedPath);
                return data?.publicUrl || value;
            } catch (error) {
                console.warn('Failed to resolve learning material URL:', error);
                return value;
            }
        }

        function getModuleProgress(module) {
            const value = Number(module.progress_percentage ?? module.progress ?? 0);
            if (Number.isNaN(value)) return 0;
            return Math.max(0, Math.min(100, Math.round(value)));
        }

        function getProgressStatus(progress) {
            if (progress >= 100) {
                return { label: 'Completed', className: 'bg-green-100 text-green-700' };
            }
            if (progress > 0) {
                return { label: 'In Progress', className: 'bg-yellow-100 text-yellow-700' };
            }
            return { label: 'Not Started', className: 'bg-gray-100 text-gray-600' };
        }

        function getEstimatedTime(module) {
            const minutes = Number(module.estimated_minutes ?? module.duration_minutes ?? module.reading_time_minutes);
            if (Number.isFinite(minutes) && minutes > 0) return `${Math.round(minutes)} min`;
            return module.content_type === 'pdf' ? '15 min' : '10 min';
        }

        function getDifficulty(module) {
            const difficulty = String(module.difficulty ?? module.level ?? 'Beginner').trim();
            if (!difficulty) return 'Beginner';
            return difficulty.charAt(0).toUpperCase() + difficulty.slice(1).toLowerCase();
        }

        function setupEventListeners() {
            // Logout
            document.getElementById('logoutButton').addEventListener('click', async () => {
                await logout();
                redirectToLogin();
            });

            // Mobile menu
            document.getElementById('mobileMenuBtn').addEventListener('click', toggleMobileMenu);
            document.getElementById('mobileOverlay').addEventListener('click', toggleMobileMenu);

            // Search
            document.getElementById('searchInput').addEventListener('input', handleSearch);

            document.querySelectorAll('.learn-quarter-tab').forEach(tab => {
                tab.addEventListener('click', () => setQuarterFilter(tab.dataset.quarter || 'all'));
            });
            updateQuarterTabs();

            document.querySelectorAll('.learn-status-chip').forEach(chip => {
                chip.addEventListener('click', () => setStatusFilter(chip.dataset.status || 'all'));
            });
            updateStatusChips();
        }

        function setQuarterFilter(quarter) {
            activeQuarterFilter = quarter || 'all';
            updateQuarterTabs();
            renderModules(modules);
        }

        function updateQuarterTabs() {
            document.querySelectorAll('.learn-quarter-tab').forEach(tab => {
                const isActive = (tab.dataset.quarter || 'all') === activeQuarterFilter;
                tab.classList.toggle('active', isActive);
            });
        }

        function setStatusFilter(status) {
            activeStatusFilter = status || 'all';
            updateStatusChips();
            renderModules(modules);
        }

        function updateStatusChips() {
            document.querySelectorAll('.learn-status-chip').forEach(chip => {
                const isActive = (chip.dataset.status || 'all') === activeStatusFilter;
                chip.classList.toggle('active', isActive);
                if (isActive) {
                    chip.className = 'learn-status-chip active px-3 py-1.5 rounded-full text-xs font-bold border-2 border-ink-900 bg-forest-600 text-white shadow-[2px_2px_0_0_#1c1b1a] transition-all';
                } else {
                    chip.className = 'learn-status-chip px-3 py-1.5 rounded-full text-xs font-bold border-2 border-ink-900 bg-white text-ink-900 hover:bg-paper-100 shadow-[2px_2px_0_0_#1c1b1a] transition-all';
                }
            });
        }

        function toggleMobileMenu() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('mobileOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function handleSearch() {
            renderModules(modules);
        }

        async function loadModules() {
            try {
                studentAssignment = await getStudentGradeSection(currentUser.id);

                const { data, error } = await getSupabase()
                    .from('modules')
                    .select('*')
                    .eq('status', 'published')
                    .order('order_index', { ascending: true });

                if (error) throw error;

                const gradeId = studentAssignment?.gradeLevel?.id;
                const sectionId = studentAssignment?.section?.id;
                const gradeName = normalizeGradeValue(studentAssignment?.gradeLevel?.name);

                modules = (data || []).filter(module => {
                    const moduleGradeId = module.grade_level_id ?? null;
                    const moduleSectionId = module.section_id ?? null;
                    const moduleGrade = normalizeGradeValue(module.grade_level ?? module.grade_level_name ?? null);

                    const gradeMatch =
                        !gradeId && !gradeName
                            ? true
                            : moduleGradeId
                                ? String(moduleGradeId) === String(gradeId)
                                : moduleGrade
                                    ? moduleGrade === gradeName
                                    : true;

                    const sectionMatch =
                        !sectionId
                            ? true
                            : moduleSectionId
                                ? String(moduleSectionId) === String(sectionId)
                                : true;

                    return gradeMatch && sectionMatch;
                });

                // Check sequential access, assessment association, and completion for each module
                let passedAssessmentIds = new Set();
                let moduleAssessmentsMap = new Map();

                try {
                    const [attemptsRes, assessmentsRes] = await Promise.all([
                        getSupabase()
                            .from('module_assessment_attempts')
                            .select('module_assessment_id, passed')
                            .eq('student_id', currentUser.id),
                        getSupabase()
                            .from('module_assessments')
                            .select('id, module_id, assessment_type')
                    ]);

                    (attemptsRes.data || []).forEach(a => {
                        if (a.passed) passedAssessmentIds.add(a.module_assessment_id);
                    });

                    (assessmentsRes.data || []).forEach(asmt => {
                        if (!moduleAssessmentsMap.has(asmt.module_id)) moduleAssessmentsMap.set(asmt.module_id, []);
                        moduleAssessmentsMap.get(asmt.module_id).push(asmt);
                    });
                } catch (metaErr) {
                    console.warn('Metadata load error:', metaErr);
                }

                for (const m of modules) {
                    try {
                        const { data: canAccess } = await getSupabase().rpc('can_student_access_module', {
                            p_student_id: currentUser.id,
                            p_module_id: m.id
                        });
                        m.is_locked = (canAccess === false);
                    } catch (err) {
                        console.warn('Access check error for module', m.id, err);
                        m.is_locked = false;
                    }

                    const asmts = moduleAssessmentsMap.get(m.id) || [];
                    m.has_quiz = asmts.length > 0;
                    const postTest = asmts.find(a => a.assessment_type === 'post_test');
                    m.is_completed = postTest ? passedAssessmentIds.has(postTest.id) : false;
                }
                
                // Hide loading state
                document.getElementById('loadingState').classList.add('hidden');
                
                if (modules.length === 0) {
                    document.getElementById('emptyState').classList.remove('hidden');
                } else {
                    document.getElementById('modulesGrid').classList.remove('hidden');
                    renderModules(modules);
                }
            } catch (error) {
                console.error('Error loading modules:', error);
                document.getElementById('loadingState').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            }
        }

        function renderModules(data) {
            const grid = document.getElementById('modulesGrid');
            const empty = document.getElementById('emptyState');
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            // Filter by Term
            const quarterFiltered = activeQuarterFilter === 'all'
                ? data
                : data.filter(module => getModuleQuarter(module) === activeQuarterFilter);

            // Filter by Status (Completed, Incompleted, Graded, Non-Graded)
            const statusFiltered = quarterFiltered.filter(module => {
                if (activeStatusFilter === 'all') return true;
                if (activeStatusFilter === 'completed') return Boolean(module.is_completed);
                if (activeStatusFilter === 'incompleted') return !module.is_completed;
                if (activeStatusFilter === 'graded') return Boolean(module.has_quiz);
                if (activeStatusFilter === 'non-graded') return !module.has_quiz;
                return true;
            });

            // Filter by Search Query
            const filtered = query
                ? statusFiltered.filter(m =>
                    (m.title || '').toLowerCase().includes(query) ||
                    ((m.description || '').toLowerCase().includes(query)) ||
                    ((m.lesson_objectives || '').toLowerCase().includes(query))
                )
                : statusFiltered;

            document.getElementById('moduleCount').textContent = filtered.length;

            if (filtered.length === 0) {
                grid.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }

            empty.classList.add('hidden');
            grid.classList.remove('hidden');
            
            grid.innerHTML = [...filtered].sort(compareModuleSequence).map(module => {
                const subtitle = module.topic || module.subject || module.grade_level_text || module.grade_level || 'Learning Module';
                const objectives = getLessonObjectives(module);
                const description = objectives.length
                    ? `Objectives: ${objectives.join(' • ')}`
                    : (module.description || 'Open this module to start learning and explore the lesson activities.');
                const weekNumber = Number(module.week_number) || null;
                const pdfSource = module.pdf_url || module.file_path || '';
                const pdfPreviewUrl = resolveLearningMaterialUrl(pdfSource);
                const lowerFilePath = String(pdfSource).toLowerCase();
                const isPdf = String(module.content_type || '').toLowerCase() === 'pdf' || lowerFilePath.includes('.pdf') || Boolean(module.pdf_url);
                const quarterLabel = getQuarterLabel(module);
                // Use first page of PDF as thumbnail if possible, else fallback to image or logo
                let previewMedia = '';
                if (isPdf && pdfPreviewUrl) {
                    previewMedia = `<iframe src="${pdfPreviewUrl}#page=1&view=FitH&toolbar=0&navpanes=0&scrollbar=0" class="module-preview-frame" title="${module.title}" style="width:100%;height:100%;min-height:120px;"></iframe>`;
                } else {
                    const thumbnailSource = module.thumbnail_url || module.cover_image || module.image_url || '';
                    const thumbnail = resolveLearningMaterialUrl(thumbnailSource) || '../Logo/MATHURO-LOGO-v2.png';
                    previewMedia = `<img src="${thumbnail}" class="module-preview-image" alt="${module.title}" onerror="this.onerror=null; this.src='../Logo/MATHURO-LOGO-v2.png';">`;
                }
                const isLocked = Boolean(module.is_locked);
                const statusLabel = isLocked ? 'Locked' : 'Available';
                return `
                <div class="learn-module-card ${isLocked ? 'is-locked' : ''} mx-auto min-w-[260px] max-w-[300px] flex flex-col relative">
                    <span class="learn-module-card-badge ${isLocked ? 'is-locked' : ''}">
                        ${isLocked ? `
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        ` : ''}
                        <span>${statusLabel}</span>
                    </span>
                    <a href="${isLocked ? 'javascript:void(0)' : `module-view.html?id=${module.id}`}"
                       onclick="${isLocked ? `alert('This module is locked. Please pass the previous module post-test first.')` : ''}"
                       aria-label="${escapeHtml(module.title)} — ${statusLabel}"
                       class="flex flex-col h-[360px] ${isLocked ? 'cursor-not-allowed' : ''}">
                        <div class="module-preview-container h-[46%] bg-gray-100 overflow-hidden flex items-center justify-center">
                            ${previewMedia}
                        </div>
                        <div class="px-5 py-4 flex flex-col flex-1">
                            <h3 class="text-lg font-bold text-gray-900 mb-1 line-clamp-1">${escapeHtml(module.title)}</h3>
                            <p class="text-sm font-medium text-gray-600 mb-1 line-clamp-1">${escapeHtml(subtitle)}</p>
                            ${quarterLabel || weekNumber ? `<p class="text-xs font-semibold text-forest-800 mb-2">${[quarterLabel, weekNumber ? `Week ${weekNumber}` : ''].filter(Boolean).join(' · ')}</p>` : ''}
                            <p class="module-description text-xs text-gray-500 leading-snug mb-4 flex-1">${escapeHtml(description)}</p>
                            <div class="learn-module-card-cta ${isLocked ? 'is-locked' : ''}">
                                ${statusLabel}
                            </div>
                        </div>
                    </a>
                </div>
            `;
            }).join('');
        }
    </script>
</body>
</html>
